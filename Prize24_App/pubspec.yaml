version: 1.0.13+30
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  cloud_firestore: ^6.1.2
  cloud_functions: ^6.0.6
  equatable: ^2.0.7
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  freezed_annotation: ^3.0.0
  go_router: ^17.1.0
  google_sign_in: ^7.1.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.6.2
  mobile_scanner: ^7.0.1
  # qr_code_scanner: ^1.0.1
  pretty_qr_code: ^3.4.0
  riverpod_annotation: ^4.0.0
  widgetbook: ^3.17.1
  purchases_flutter: ^10.3.0
  purchases_ui_flutter: ^10.3.0
  font_awesome_flutter: ^11.0.0
  flutter_launcher_icons: ^0.14.4
  google_fonts: ^8.0.2
  timeago: ^3.7.1
  url_launcher: ^6.3.2
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  collection: ^1.19.1
  sentry_flutter: ^9.10.0
  share_plus: ^13.1.0
  firebase_analytics: ^12.1.2
  country_code_picker_plus: 0.1.0+1

dev_dependencies:
  build_runner: ^2.4.15
  custom_lint: ^0.8.1
  flutter_test:
    sdk: flutter
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  very_good_analysis: ^10.2.0
  flutter_native_splash: ^2.3.10

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
        - asset: assets/fonts/Gilroy-Medium.ttf
          style: italic
    # Fira COde
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode.ttf
